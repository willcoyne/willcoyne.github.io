<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Will Coyne: resume, projects, and links, hung on the walls of a room you can walk around." />
    <title>will coyne</title>
    <script>
      // No WebGL, no room: send visitors to the classic page instead.
      (function () {
        try {
          var c = document.createElement('canvas')
          if (c.getContext('webgl2') || c.getContext('webgl')) return
        } catch (e) {}
        location.replace('/classic/')
      })()
    </script>
  </head>
  <body>
    <div id="room-root"></div>
    <noscript>
      <p style="font-family:monospace;padding:2rem">This page needs JavaScript. <a href="/classic/">Open the classic site</a>.</p>
    </noscript>
    <script type="module" src="/src/room/main.jsx"></script>
  </body>
</html>
