version: '3.8'
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: willcoyne
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  server:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "4000:4000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: example
      DB_NAME: willcoyne
      ADMIN_API_KEY: replace_with_strong_api_key
      SMTP_HOST: smtp.example.com
      SMTP_PORT: 587
      SMTP_USER: smtp-user
      SMTP_PASS: smtp-pass
      EMAIL_FROM: '"William" <will17coyne@gmail.com>'
      FRONTEND_ORIGIN: http://localhost:5173

volumes:
  db_data:
